[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceflow-agent"
version = "0.1.0"
description = "Evidence-bound enterprise policy ReAct agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph>=1.0,<2", "pydantic>=2.10,<3", "httpx==0.28.1",
  "python-dotenv>=1.0,<2", "numpy>=1.26,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1", "streamlit>=1.40,<2", "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "build>=1.2,<2"]
embeddings = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "huggingface-hub>=0.29,<2"]

[project.scripts]
evidenceflow = "evidenceflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

